<div *ngIf="canManageBookings()">
  <button (click)="addBooking()" class="btn btn-info">Add Booking</button>
</div>
<p>{{ message }}</p>
<table class="table" *ngIf="bookings && bookings.length > 0">
  <thead>
    <tr>
      <th>Trip</th>
      <th>Customer</th>
      <th>Email</th>
      <th>Seats</th>
      <th>Status</th>
      <th *ngIf="canManageBookings()"></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let booking of bookings">
      <td>{{ booking.tripName }} ({{ booking.tripCode }})</td>
      <td>{{ booking.customerName }}</td>
      <td>{{ booking.customerEmail }}</td>
      <td>{{ booking.seats }}</td>
      <td>{{ booking.status }}</td>
      <td *ngIf="canManageBookings()">
        <button *ngIf="booking.status === 'confirmed'" (click)="cancelBooking(booking)"
          class="btn btn-sm btn-danger">Cancel</button>
      </td>
    </tr>
  </tbody>
</table>
